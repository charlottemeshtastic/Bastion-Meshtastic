name: bastion_meshtastic
description: Independent Bastion companion for Meshtastic; early Android scaffold.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  universal_ble: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - branding/bastion-icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: branding/bastion-icon.png
  adaptive_icon_background: '#0B0E11'
  adaptive_icon_foreground: branding/bastion-icon.png
