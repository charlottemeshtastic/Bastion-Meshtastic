name: Bastion Release Candidate Package
on:
  workflow_dispatch:
    inputs:
      release_label:
        description: 'Human-readable release candidate label'
        required: true
        default: 'Bastion RC'
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 25
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Prepare Android build
        run: |
          flutter create --platforms=android --org org.backcountrysignal --project-name bastion .
          rm -f test/widget_test.dart
          python3 scripts/prepare_android.py
          flutter pub get
          dart run flutter_launcher_icons
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
      - name: Build release-mode test APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Prepare package
        env:
          RELEASE_LABEL: ${{ inputs.release_label }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p release-package
          cp build/app/outputs/flutter-apk/app-release.apk release-package/Bastion-RC-arm64.apk
          sha256sum release-package/Bastion-RC-arm64.apk > release-package/SHA256SUMS.txt
          printf 'Release candidate: %s\nCommit: %s\nRun: %s\n' "$RELEASE_LABEL" "$COMMIT_SHA" "$GITHUB_RUN_ID" > release-package/BUILD-INFO.txt
          git log -n 20 --pretty=format:'- %h %s' > release-package/CHANGES.txt
          printf '\n' >> release-package/CHANGES.txt
      - name: Upload candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-Release-Candidate-${{ github.run_number }}
          path: release-package/
          retention-days: 30
          if-no-files-found: error
