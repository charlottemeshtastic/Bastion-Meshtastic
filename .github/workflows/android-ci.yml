name: Bastion Meshtastic Android CI

on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Generate Android platform
        run: |
          flutter create --platforms=android --org app.bastion --project-name bastion_meshtastic .
          # Flutter's default template test references MyApp, not BastionMeshtasticApp.
          rm -f test/widget_test.dart
      - name: Prepare permissions
        run: python3 scripts/prepare_android.py
      - name: Normalize launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          magick branding/bastion-icon.png -resize 1024x1024 -strip -define png:color-type=6 PNG32:branding/bastion-icon-normalized.png
          mv branding/bastion-icon-normalized.png branding/bastion-icon.png
          file branding/bastion-icon.png
      - name: Install dependencies and icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Generate protocol bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          python3 scripts/generate_protos.py
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test --timeout 2m
      - name: Build development APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-Meshtastic-Development-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
