name: Bastion Android CI

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Cancel superseded builds on the same branch or pull request.
# Preserve builds from other branches and manually dispatched runs.
concurrency:
  group: bastion-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
      - name: Generate Android platform
        run: |
          flutter create --platforms=android --org org.backcountrysignal --project-name bastion .
          # Flutter's default template test references MyApp, not BastionApp.
          rm -f test/widget_test.dart
      - name: Prepare permissions
        run: python3 scripts/prepare_android.py
      - name: Install dependencies and icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
      - name: Build development APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-Development-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Email successful main build APK
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APK_EMAIL_USERNAME: ${{ secrets.APK_EMAIL_USERNAME }}
          APK_EMAIL_APP_PASSWORD: ${{ secrets.APK_EMAIL_APP_PASSWORD }}
          APK_EMAIL_RECIPIENT: backcountrysignal@gmail.com
          APK_PATH: build/app/outputs/flutter-apk/app-release.apk
          BUILD_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_SHA: ${{ github.sha }}
        run: python3 scripts/email_apk.py
