name: Bastion Android CI

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Cancel superseded builds on the same branch or pull request.
# Preserve builds from other branches and manually dispatched runs.
concurrency:
  group: bastion-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
      - name: Generate Android platform
        run: |
          flutter create --platforms=android --org org.backcountrysignal --project-name bastion .
          # Flutter's default template test references MyApp, not BastionApp.
          rm -f test/widget_test.dart
      - name: Prepare permissions
        run: python3 scripts/prepare_android.py
      - name: Install dependencies and icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Analyze and test
        run: |
          mkdir -p build/ci-diagnostics
          set -o pipefail
          flutter analyze 2>&1 | tee build/ci-diagnostics/analyze.log
          flutter test --reporter expanded 2>&1 | tee build/ci-diagnostics/tests.log
      - name: Build development APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify and document test APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p build/ci-package
          cp build/app/outputs/flutter-apk/app-release.apk build/ci-package/Bastion-Integration-arm64.apk
          (cd build/ci-package && sha256sum Bastion-Integration-arm64.apk > SHA256SUMS.txt)
          git log -n 20 --pretty=format:'- %h %s' > build/ci-package/CHANGES.txt
          printf '\n' >> build/ci-package/CHANGES.txt
          printf 'Commit: %s\nRun: %s\nBranch: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_REF_NAME" > build/ci-package/BUILD-INFO.txt
          echo '### Bastion integration APK ready' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the Bastion-Integration-Test-Package artifact from this run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload integration test package
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-Integration-Test-Package
          path: build/ci-package/
          retention-days: 30
          if-no-files-found: error
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-CI-Diagnostics
          path: build/ci-diagnostics/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-Development-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Email successful main build APK
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APK_EMAIL_USERNAME: ${{ secrets.APK_EMAIL_USERNAME }}
          APK_EMAIL_APP_PASSWORD: ${{ secrets.APK_EMAIL_APP_PASSWORD }}
          APK_EMAIL_RECIPIENT: backcountrysignal@gmail.com
          APK_PATH: build/app/outputs/flutter-apk/app-release.apk
          BUILD_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_SHA: ${{ github.sha }}
        run: python3 scripts/email_apk.py
