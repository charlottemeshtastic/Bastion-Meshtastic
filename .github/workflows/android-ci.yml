name: Bastion Meshtastic Android CI

on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
      - name: Generate Android platform
        run: flutter create --platforms=android --org app.bastion --project-name bastion_meshtastic .
      - name: Prepare permissions
        run: python3 scripts/prepare_android.py
      - name: Install dependencies and icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
      - name: Build development APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-Meshtastic-Development-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
