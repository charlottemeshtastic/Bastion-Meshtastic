name: Bastion Dependency Audit
on:
  schedule:
    - cron: '37 9 * * 1'
  workflow_dispatch:
  push:
    paths:
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/dependency-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
      - run: flutter pub get
      - name: Dependency status
        run: flutter pub outdated
      - name: Security advisories
        run: dart pub audit
