name: Bastion Android Emulator Smoke Test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'scripts/prepare_android.py'
      - '.github/workflows/android-device-test.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
      - run: |
          flutter create --platforms=android --org org.backcountrysignal --project-name bastion .
          rm -f test/widget_test.dart
          python3 scripts/prepare_android.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --debug
      - name: Boot emulator and install APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm list packages | grep org.backcountrysignal
            adb logcat -d -t 100 > emulator-log.txt
      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-Emulator-Log
          path: emulator-log.txt
          if-no-files-found: warn
