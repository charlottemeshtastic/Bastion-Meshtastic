name: Generate Meshtastic protobufs

# Regenerates lib/generated/ from the official meshtastic/protobufs release
# named in tool/meshtastic_protobufs.version. To upgrade, edit that file and
# push, or run this workflow manually.
on:
  push:
    paths:
      - tool/meshtastic_protobufs.version
      - .github/workflows/generate-protobufs.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: protobufs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
      - name: Install protoc and Dart plugin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler libprotobuf-dev
          dart pub global activate protoc_plugin 25.1.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Generate Dart code
        run: |
          version=$(tr -d '[:space:]' < tool/meshtastic_protobufs.version)
          git clone --quiet --depth 1 --branch "$version" https://github.com/meshtastic/protobufs.git "$RUNNER_TEMP/pb"
          rm -rf lib/generated
          mkdir -p lib/generated
          cd "$RUNNER_TEMP/pb"
          protoc -I. -I/usr/include --dart_out="$GITHUB_WORKSPACE/lib/generated" \
            meshtastic/*.proto nanopb.proto google/protobuf/descriptor.proto
          cd "$GITHUB_WORKSPACE"
          printf 'Generated from meshtastic/protobufs %s by protoc_plugin 25.1.0.\nDo not edit by hand; see .github/workflows/generate-protobufs.yml.\n' "$version" > lib/generated/README.md
      - name: Verify generated code compiles
        run: |
          flutter pub get
          dart analyze --no-fatal-warnings --no-fatal-infos lib/generated
      - name: Commit generated code
        run: |
          git add lib/generated
          if git diff --cached --quiet; then
            echo "Generated code is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Regenerate Meshtastic protobufs $(cat tool/meshtastic_protobufs.version)"
          git push
