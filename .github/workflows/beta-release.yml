name: Bastion Beta Release
on:
  workflow_dispatch:
    inputs:
      beta_label:
        description: 'Beta label (e.g. beta-2)'
        required: true
        default: beta-test
        type: string
permissions:
  contents: read
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 25
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
      - run: |
          flutter create --platforms=android --org org.backcountrysignal --project-name bastion .
          rm -f test/widget_test.dart
          python3 scripts/prepare_android.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter analyze
          flutter test
          flutter build apk --release --target-platform android-arm64
      - name: Package beta (unsigned for Play distribution)
        env:
          BETA_LABEL: ${{ inputs.beta_label }}
        run: |
          mkdir -p beta
          cp build/app/outputs/flutter-apk/app-release.apk beta/Bastion-Beta-arm64.apk
          (cd beta && sha256sum Bastion-Beta-arm64.apk > SHA256SUMS.txt)
          git log -n 20 --pretty=format:'- %h %s' > beta/CHANGES.md
          printf '\nBeta label: %s\nCommit: %s\n' "$BETA_LABEL" "$GITHUB_SHA" > beta/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Bastion-Beta-${{ github.run_number }}
          path: beta/
          retention-days: 30
          if-no-files-found: error
