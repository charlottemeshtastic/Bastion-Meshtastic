name: Bastion Google Play Readiness
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pubspec.yaml'
      - 'scripts/prepare_android.py'
      - '.github/workflows/play-readiness.yml'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
      - run: |
          flutter create --platforms=android --org org.backcountrysignal --project-name bastion .
          rm -f test/widget_test.dart
          python3 scripts/prepare_android.py
          flutter pub get
          dart run flutter_launcher_icons
          flutter analyze
          flutter test
      - name: Build Android App Bundle (not Play signed)
        run: flutter build appbundle --release
      - name: Verify bundle
        run: test -s build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Bastion-Play-Readiness-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error
